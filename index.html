<!DOCTYPE html>
<html lang="ar" dir="rtl"><!-- تُضبط فعلياً بالسكريبت أدناه قبل الرسم -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Dama Tahiro — competitive Spanish Checkers · منصة الضامة التنافسية العالمية" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
    /* ضبط اللغة والاتجاه قبل الرسم — يمنع وميض RTL لغير الناطقين بالعربية */
    (function(){
      var l=null; try{ l=localStorage.getItem("damaLang"); }catch(e){}
      if(["ar","en","es","zh"].indexOf(l)<0){
        var n=((navigator.languages&&navigator.languages[0])||navigator.language||"").toLowerCase();
        l = n.indexOf("ar")===0 ? "ar" : n.indexOf("es")===0 ? "es" : n.indexOf("zh")===0 ? "zh" : null;
        if(!l){
          var r=(/[-_]([a-z]{2})\b/.exec(n)||[])[1]; r=r?r.toUpperCase():"";
          l = "MA DZ TN LY EG SD SA AE QA BH KW OM YE JO LB SY IQ PS MR".indexOf(r)>=0 ? "ar"
            : "ES MX AR CO CL PE VE EC GT CU BO DO HN PY SV NI CR PA UY PR".indexOf(r)>=0 ? "es"
            : "CN TW HK MO SG".indexOf(r)>=0 ? "zh" : "en";
        }
      }
      document.documentElement.lang=l;
      document.documentElement.dir=(l==="ar")?"rtl":"ltr";
    })();
    </script>
    <title>🎮 Dama Tahiro | Spanish Checkers · الضامة التنافسية</title>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        overflow: hidden;
        font-family: 'Cairo', 'Noto Sans SC', sans-serif;
      }
      #root {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
