name: Build Dama Tahiro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ──────────────── نسخة الويب (اللعبة في ملف HTML واحد) ────────────────
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dama-web
          path: dist/index.html
          if-no-files-found: error

  # ──────────────── تطبيق أندرويد: APK للتجربة + APK/AAB موقّعان ────────────────
  android:
    name: Android
    runs-on: ubuntu-latest
    # متاحة لكل خطوات gradle — كتلة signingConfigs تُقيَّم في بناء debug أيضاً
    env:
      KEYSTORE_PATH:     ${{ github.workspace }}/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build web assets (test ads for the debug APK)
        env:
          VITE_TEST_ADS: '1'
        run: npm run build

      - name: Prepare Android project
        run: |
          if [ -d android ]; then npx cap sync android; else npx cap add android; fi

      - name: Decode keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "✅ مفتاح التوقيع جاهز"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا توجد أسرار توقيع — سيُبنى APK للتجربة فقط. أضف KEYSTORE_BASE64 و KEYSTORE_PASSWORD و KEY_ALIAS و KEY_PASSWORD في Settings → Secrets and variables → Actions."
          fi

      - name: Configure version & signing
        run: |
          if [ "${{ steps.ks.outputs.sign }}" = "true" ]; then
            python3 scripts/prepare-android.py --version-code ${{ github.run_number }} --sign
          else
            python3 scripts/prepare-android.py --version-code ${{ github.run_number }}
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # يفشل البناء إن حمل الـAPK أيقونة افتراضية بدل أيقونة اللعبة
      - name: Verify app icon inside the APK
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || pip3 install --quiet pillow
          python3 scripts/verify-apk-icon.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dama-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # نسخة الإصدار تُبنى من جديد بإعلانات حقيقية (بلا isTesting)
      - name: Rebuild web assets with live ads
        if: steps.ks.outputs.sign == 'true'
        run: |
          npm run build
          npx cap sync android

      - name: Build signed release APK + AAB
        if: steps.ks.outputs.sign == 'true'
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dama-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dama-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
